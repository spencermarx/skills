name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skills/_incubating/whiteboard/server/package-lock.json
      - run: npm ci
      # The whiteboard server's dependencies, so its suites run instead of skipping. They run
      # headless (WHITEBOARD_NO_CANVAS), so neither Chromium nor the app build is needed.
      - run: npm ci --prefix skills/_incubating/whiteboard/server --no-audit --no-fund
      # Manifest sync, the portability contract, the installer tests and the whiteboard suites.
      - run: npm test
      # The Claude Code plugin and marketplace schema, as Claude Code itself reads them.
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      # Deterministic harness checks from the eval engine, run against this repository.
      - run: python3 skills/harness/harness-eval/scripts/check_descriptions.py .
        if: hashFiles('skills/harness/harness-eval/scripts/check_descriptions.py') != ''
